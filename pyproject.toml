[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests add the project root before importing local packages.
"tests/test_records.py" = ["E402"]
"tests/test_reviewer_fixes.py" = ["E402"]
"eval/run_eval.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

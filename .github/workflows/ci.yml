name: CI

on:
  push:
    branches: [main, 'day-12-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: offline
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Ruff lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test with fake LLMs; no provider secrets
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore

  container:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build real image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: fasalbima-sathi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Start single-port deployment without LLM secrets
        run: docker run -d --name fasalbima-ci -p 127.0.0.1:7860:7860 -e LLM_PROVIDER=offline fasalbima-sathi:ci
      - name: Check API, UI and mandatory Q6 refusal
        run: python deploy/smoke.py http://127.0.0.1:7860 --output smoke-results.json
      - name: Verify the Day 11 API and UI Compose services really start
        run: |
          docker tag fasalbima-sathi:ci fasalbima-sathi:day11
          docker compose --env-file .env.example up --no-build --wait --wait-timeout 180
          python -c "import json,urllib.request as u; h=json.load(u.urlopen('http://127.0.0.1:8000/health',timeout=10)); assert h['product']=='FasalBima Sathi'; assert h['records_count']>=20; assert u.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=10).status==200; print('Compose API and UI: passed')"
      - name: Collect container startup logs
        if: always()
        run: |
          docker logs fasalbima-ci > container.log 2>&1 || true
          docker compose --env-file .env.example logs --no-color > compose.log 2>&1 || true
      - name: Save container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-evidence
          path: |
            container.log
            compose.log
            smoke-results.json
      - name: Stop container
        if: always()
        run: |
          docker rm -f fasalbima-ci || true
          docker compose --env-file .env.example down || true
